{% extends 'layout.html' %}

{% block content %}
<div class="container user-find-id-container my-6">

    <!-- 타이틀 영역 -->
    <div class="user__header mb-5">
        <div class="top text-center">
            <h1 class="title">아이디 찾기</h1>
        </div>
    </div>

    {% if found_username %}
        <div class="mb-5">
            <p class="text-center">회원님의 아이디는 <strong>{{ found_username }}</strong> 입니다.</p>
        </div>
        <a href="{{ doc_root }}login" class="btn btn-primary w-100">로그인하러 가기</a>
    {% else %}
        <p class="text-center">가입할 때 입력한 이메일을 아래 입력란에 입력해 주세요.</p>
        <form method="POST" id="findIdForm">
            <div class="mb-5">
                <input type="email" class="form-control {{ errors.find ? 'is-invalid' : '' }}" id="email" name="email" value="{{ email }}" maxlength="100" placeholder="example@example.com" required>
                {% if errors.find %}
                    <div class="invalid-feedback fw-bold">
                        <i class="bi bi-exclamation-circle me-1"></i> {{ errors.find }}
                    </div>
                {% endif %}
            </div>

            <button class="btn btn-primary w-100" type="submit">아이디 찾기</button>
        </form>
    {% endif %}

</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('findIdForm').addEventListener('submit', function(e) {
    const emailInput = document.getElementById('email');
    const email = emailInput.value.trim();

    if (!email) {
        e.preventDefault();
        alert('이메일을 입력해 주세요.');
        emailInput.focus();
        return;
    }
});
</script>
{% endblock %}
