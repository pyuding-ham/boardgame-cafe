{% extends 'layout.html' %}

{% block title %}접근 권한이 없습니다.{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-7 text-center py-5">
            <div class="text-secondary display-1 mb-4">
                <i class="bi bi-shield-fill-exclamation"></i>
            </div>

            <h2 class="fw-bold mb-5">접근 권한이 없습니다.</h2>

            <p class="text-muted mb-5">
                요청하신 페이지에 접근할 수 있는 권한이 없습니다.<br>
                로그인 상태를 확인하거나 관리자에게 문의해 주세요.
            </p>

            <div class="d-flex justify-content-center gap-2">
                <a href="{{ doc_root }}" class="btn btn-primary px-4">홈으로 이동</a>
                <button type="button" class="btn btn-outline-secondary px-4" onclick="history.back();">이전 페이지</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
